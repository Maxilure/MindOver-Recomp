# The markers over the heads (CPlayerIdentifierArrow): the set-up's picture name (r11 = player *
# 8, r3 = table + player * 8, right before use) and the draw's colour (r10 = player * 4, r9 = the
# colour just read from the two-entry table at 0x825B0120).
[[entrypoint.midasm_hook]]
address = 0x8226CF3C
name = "MorePlayersMarkerPicture"
registers = ["r11", "r3"]
[[entrypoint.midasm_hook]]
address = 0x8226D7F0
name = "MorePlayersMarkerColour"
registers = ["r10", "r9"]
# The reticle's colours by player (r_index = player * 4, the colour just read by "lwzx"):
# sub_822AE000 (0x822AE028 -> r7, either table), sub_822AE410 (0x822AE450 -> r11 normal table;
# 0x822AE460 -> r7 flashing table). Players 3-4: their marker colours.
[[entrypoint.midasm_hook]]
address = 0x822AE02C
name = "MorePlayersReticleColour"
registers = ["r9", "r7"]
[[entrypoint.midasm_hook]]
address = 0x822AE454
name = "MorePlayersReticleColour"
registers = ["r10", "r11"]
[[entrypoint.midasm_hook]]
address = 0x822AE464
name = "MorePlayersReticleFlashColour"
registers = ["r10", "r7"]
