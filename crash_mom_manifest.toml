# DROP OUT for more players (findings/26 s.24; src/players/more_players.cpp, sub_822357B0).
# CCoOpBehaviour's Drop Out handler (front end message 48/7, pause menu "Drop Out") picks
# its path by "players 1 AND 2 both in game" (lwz r11,0(r9) / lwz r11,4(r9), r9 = the state
# table): before each "cmpwi r11,2", r11 = 2 when nobody rides the one dropping out and
# someone else plays, else 0 (path B frees its riders). Found 2026-10-05: player 3 dropping
# out with player 2 a mask took path B and set PLAYER 1's sub-state to 4 (verified with
# xexdis: 0x822357EC..0x82235800, r31 = the behaviour from 0x822357C4).
[[entrypoint.midasm_hook]]
address = 0x822357F0
name = "MorePlayersDropOutPath"
registers = ["r11", "r31"]
[[entrypoint.midasm_hook]]
address = 0x822357FC
name = "MorePlayersDropOutPath"
registers = ["r11", "r31"]
# The fight tree's "put a dropped-out player away" step sub_820C0EF0 (findings/26 s.31): once
# Drop Out has set the player "not joined", the tree only leaves for CoOpNotJoinedGame (whose
# action hides the Crash as a mask on a player in game) if "the other player" is in game:
# player 2 for player 1 (0x820C0F94: lwz r11,4(r30)), player 1 for the rest (0x820C0F9C:
# lwz r11,0(r30)), both joining at the "cmpwi cr6,r11,2" at 0x820C0FA0 (r29 = my player
# number from sub_8226FCD8 at 0x820C0F40, verified with xexdis). With more than two players,
# r11 = 2 when ANY other player is in game. Found 2026-10-06: player 1 dropping out next to
# only player 3 stayed a steerable "ghost" Crash (tree transition trace, two vs three players).
[[entrypoint.midasm_hook]]
address = 0x820C0FA0
name = "MorePlayersTreeOtherInGame"
registers = ["r11", "r29"]
