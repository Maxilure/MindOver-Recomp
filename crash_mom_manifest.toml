# the starting-state array (was 0x824F3C30): right after its address is computed
#   sub_82234C80: addi r8 at 0x82234CB4, stwx right here
[[entrypoint.midasm_hook]]
address = 0x82234CB8
name = "MorePlayersStartStateBase"
registers = ["r8"]
#   sub_82234C80: addi r8 at 0x82234CC8, stwx right here
[[entrypoint.midasm_hook]]
address = 0x82234CCC
name = "MorePlayersStartStateBase"
registers = ["r8"]
#   sub_82235C30: addi r9 at 0x82235C48, lwzx at 0x82235C50
[[entrypoint.midasm_hook]]
address = 0x82235C4C
name = "MorePlayersStartStateBase"
registers = ["r9"]

# the float that was at 0x824F3C44 (sub-state[3] now): its 2 users, base register
# pointed at our block before the first access (r30 serves the lfs AND the stfs at
# 0x821AD9B4, and nothing else in the function; restored from the stack at exit).
# A first version treated it as a constant: the first scan missed the stfs (it
# stopped at a lis base's first use) -> Crash lay on the ground, respawning.
#   sub_821AD970: lfs f0,15428(r30) right here, stfs f0,15428(r30) at 0x821AD9B4
[[entrypoint.midasm_hook]]
address = 0x821AD994
