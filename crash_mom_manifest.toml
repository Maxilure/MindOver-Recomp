# -----------------------------------------------------------------------------
# Native replacements for C runtime / XAPI functions ("ReXCRT")
# -----------------------------------------------------------------------------
# Maps a function name to its address in THIS game's exe. Codegen then emits
# `rexcrt_<Name>` for it, and the SDK supplies a native implementation.
[entrypoint.rexcrt]

# FIBERS. The game runs cooperative tasks on fibers: sub_8235B218 is its
# "resume task" routine (sets the current task at scheduler+0x2C, then
# SwitchToFiber(task->fiber at +0x14)). A fiber switch swaps the whole CPU
# state including the stack pointer. Recompiled C++ can't do that on its
# own, because each guest fiber also needs its own HOST stack. The SDK's
# versions run every guest fiber on a real host fiber (ucontext on Linux).
#
# Identified 2026-09-25 from behavior, in XAPILIB (statically linked):
#   thread = *(r13 + 0x100); thread->fiber = *(thread + 0x164)
ConvertThreadToFiber = 0x82473E08  # err 0x500 ALREADY_FIBER; allocs 0xA50 ctx
ConvertFiberToThread = 0x82473E98  # clears thread+0x164; err 0x501 ALREADY_THREAD
CreateFiber          = 0x82473EE8  # stack: round to 4K, min 16K; LR = trampoline
DeleteFiber          = 0x82473FC8  # frees stack + ctx; exits thread if current
SwitchToFiber        = 0x82474028  # thunk -> XapiSwitchToFiberBody

# -----------------------------------------------------------------------------
# Mid-function hooks ("midasm"): a call to OUR C++ inserted at one instruction
# -----------------------------------------------------------------------------
# Codegen emits `extern void <name>(PPCRegister& rN, ...);` and calls it right
# before the instruction at `address` (after it with after_instruction = true),
# passing the listed guest registers by reference so the hook can read or
# change them. Implementations live in src/ with plain C++ linkage.

# FRAME LIMITER (src/frame_rate.cpp, docs/findings/07). The game's main loop
# (sub_8227AEE0) caps itself at 30 fps: r29 = microseconds since the last
# frame, and
#   0x8227B0DC  cmplwi cr6,r29,33333    ; 1/30 s
#   0x8227B0E0  ble    0x8227AFC0       ; not yet: spin and re-read the clock
# otherwise it runs one frame (vtable slot 44) with the real delta time.
# The hook sees r29 first and, when --fps_cap asks for another rate, replaces
# it with "past the threshold" or "not yet" for OUR frame time. Safe because
# r29 is only this comparison's input: every other read in the loop comes
# after it's recomputed (subf r29,r11,r30 at 0x8227B030, mr r29,r3 at
# 0x8227AF78).
# Found by disassembly: D3D's presentation interval was the first suspect,
# but logging showed the game already asks for interval 1 (60 Hz).
[[entrypoint.midasm_hook]]
address = 0x8227B0DC
name = "CrashMomFrameLimiter"
registers = ["r29"]

# RENDERER VSYNC MODE (src/frame_rate.cpp, docs/findings/07). This is what
# actually holds title, menus and gameplay at 30 fps. Radical's renderer
# (PDDI) "swap buffers" routine sub_82433510 reads a vsync mode from
# this+1660 and:
#   mode 1: waits until the vblank count (a global at 0x8258E460, copied by
#           the game's D3D vblank callback 0x82433380) moves past `last`;
#           if exactly one vblank passed, sets last = count + 1, so the NEXT
#           frame waits two vblanks: a 30 fps pace with catch-up. Then D3D
#           presentation interval ONE.
#   mode 0: no extra wait, interval ONE: plain 60 Hz vsync.
#   other : interval IMMEDIATE (0x80000000), used by loading screens.
#     0x8243352C  lwz    r10,1660(r31)   ; mode
#     0x82433534  cmpwi  cr6,r10,1
#     0x82433544  bne    cr6,0x82433598  ; -> cmpwi r10,0 / li r29,1 (mode 0)
# The hook sees r10 before the compare and, when --fps_cap isn't 30, turns
# mode 1 into mode 2 (first version: 0, the game's own 60 fps path; since the
# clock pacer, 2026-09-30: 2 = present right away, the path its loading
# screens take and its mode 1 takes for a LATE frame, 0x82433594 skipping
# `li r29,1`; the clock decides when frames start, frame_rate.cpp section 1b).
# r10 is only read by these two compares before being overwritten.
# Found by: guest vblanks at 1000 Hz (--vsync=false) lifted the title from
# 30 to 59 fps, so something counted vblanks; the vblank callback registered
# via D3D's SetVerticalBlankCallback (sub_82311388, called from PDDI init
# sub_82433B00) led to the only reader of its global, this function.
[[entrypoint.midasm_hook]]
address = 0x82433534
name = "CrashMomVsyncMode"
registers = ["r10"]

# THE GAME'S OWN 60 FPS CEILING (src/frame_rate.cpp section 1b, 2026-09-30).
# Found when --fps_cap=144 still gave exactly 59 fps (16.7 ms per frame) even
# with a 144 Hz virtual refresh AND the renderer's no-vsync mode: 60 stack
# samples of the main thread (gdb) showed it spinning in the main loop
# (clock reads, subsystem updates) and only ~1 in 8 samples in the frame
# function sub_8227C5D8. That function ACCUMULATES the elapsed time and skips
# the frame until a minimum step has built up:
#   0x8227C604  lfs    f30,28(r27)      ; f30 = 0.016666668 (1/60 s, at 0x8201FB80)
#   0x8227C658  lfs    f0,160(r31)      ; the accumulated time
#   0x8227C65C  fadds  f0,f31,f0        ;   += this pass's delta
#   0x8227C670  fcmpu  cr6,f0,f30       ; less than 1/60 s so far?
#   0x8227C674  blt    cr6,0x8227c7e4   ;   -> no frame this pass
# (and clamps one step to 0.1 s, the constant at 0x8201FB64). The hook runs
# right before the compare. First version: f30 = 1/fps_cap above 60. Since
# the clock pacer (same day, frame_rate.cpp section 1b): for any cap but 30,
# f30 = 0 ("run now") or 1e30 ("not yet") as OUR clock decides, sleeping
# in between; the accumulated time (reset to 0.0 after each frame, at
# 0x8227C7DC) stays the frame's real step. f30 isn't used again in the
# function (only restored at exit).
[[entrypoint.midasm_hook]]
address = 0x8227C670
name = "CrashMomFrameStep"
registers = ["f30"]

# AUDIO DUMP (src/audio_trace.cpp, --debug_audio_dump). The XDK's audio
# render thread hands every mixed frame (256 samples x 6 channels, big-endian
# floats, one whole channel after another) to the kernel here:
#   0x824819E8  lwz r4,88(r1)       ; the frame
#   0x824819EC  lwz r3,24(r31)      ; the render driver handle
#   0x824819F0  bl  0x824BC2BC      ; XAudioSubmitRenderDriverFrame
# That kernel export is called directly (there is no weak sub_ to override),
# so this hook sees r4 right before the call and copies the frame into a WAV
# file. It only reads r4.
# Found 2026-09-27 (a missing voice line in a cutscene): the one call site of
# __imp__XAudioSubmitRenderDriverFrame in the generated code.
[[entrypoint.midasm_hook]]
address = 0x824819F0
name = "CrashMomAudioFrame"
registers = ["r4"]

# SAVE NAMES UP TO 16 CHARACTERS IN THE GAME'S NAME SCREEN (src/saves/
# save_library.cpp, findings/24 section 6). The name entry screen's "type the
# selected key" (CNameEntryScreenAction, sub_820D6618) stops at 9:
#   0x820D6634  bl     0x82375938       ; r3 = wcslen(name buffer 0x825A06F8)
#   0x820D663C  cmpwi  cr6,r11,9        ; (r11 = r3)
#   0x820D6640  bge    cr6,0x820d66a4   ; full -> the error sound
# The hook runs right before the bge and returns true while the name is
# shorter than our 16 (the rename box's limit): the jump then skips the bge
# and the character is added. 16 still fits beside a save's picture on the
# Load Game screen; New Game's copy of the name (ResetSaveFileHeader,
# sub_82259408) keeps 32 characters.
# Found 2026-10-03 by disassembly (the function's only length check).
[[entrypoint.midasm_hook]]
address = 0x820D6640
name = "CrashMomNameEntryRoom"
registers = ["r11"]
jump_address_on_true = 0x820D6644

# =============================================================================
# FOUR PLAYERS' ROOM IN THE CO-OP TABLES (src/players/more_players.cpp,
# docs/findings/26). The game keeps each player's co-op state in global
# tables with TWO entries. The state table (0x8259B11C, 37 code sites) and
# the starting sub-state table (0x824F3C38, 24 sites) GROW IN PLACE to four
# entries; what sat right after them moves to a block of ours, and so does
# the starting-state table (0x824F3C30, 5 sites). Tiny getters/setters are
# rewritten in C++; every other reference gets one of the hooks below, which
# point the register holding the old address at the new place (each hook runs
# right BEFORE its instruction). Found 2026-10-04: every lis/lo reference to
# the area listed by a scratch scanner (lis + addi/lwz/stw/... with the same
# register, function and owning class from the RTTI vtables; EVERY access through
# a lis base until the register is overwritten), each one read in
# xexdis; no stored pointers to these areas exist in the image. Always on:
# nothing changes for players 1-2.
# =============================================================================

# the per-player flag bytes (were 0x8259B124)
#   sub_8210E260 (CControllerDigBehaviour): addi r8 = &flags at 0x8210E2D8, stbx at 0x8210E2EC
[[entrypoint.midasm_hook]]
address = 0x8210E2DC
name = "MorePlayersFlagsBase"
registers = ["r8"]
#   sub_8210E310 (CControllerDigBehaviour): addi r7 = &flags at 0x8210E348
[[entrypoint.midasm_hook]]
address = 0x8210E34C
name = "MorePlayersFlagsBase"
registers = ["r7"]
#   sub_821B9D48: addi r10 = &flags at 0x821B9E10, lbzx right here
[[entrypoint.midasm_hook]]
address = 0x821B9E14
name = "MorePlayersFlagsBase"
registers = ["r10"]
#   sub_822225D8 (TurretProp): addi r10 = &flags at 0x82222714, lbzx right here
[[entrypoint.midasm_hook]]
address = 0x82222718
name = "MorePlayersFlagsBase"
registers = ["r10"]
#   sub_82234AE0 (co-op): addi r10 = &flags at 0x82234AF4, lbzx right here
[[entrypoint.midasm_hook]]
address = 0x82234AF8
name = "MorePlayersFlagsBase"
registers = ["r10"]
#   sub_82235258 (co-op): addi r5 = &flags at 0x822352F4, lbzx right here
[[entrypoint.midasm_hook]]
address = 0x822352F8
name = "MorePlayersFlagsBase"
