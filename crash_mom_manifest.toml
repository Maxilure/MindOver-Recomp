0x820E9570 = {}  # 16 code refs (e.g. 0x820E8530); was inside sub_820E9560
0x820E9580 = {}  # 16 code refs (e.g. 0x820E84BC); was inside sub_820E9560
0x820E9590 = {}  # 16 code refs (e.g. 0x820E84AC); was inside sub_820E9560
0x82148DE8 = {}  # 1 code ref (e.g. 0x82148B40); was inside sub_82148DD8
