name = "MorePlayersTitanGuard"
registers = ["r19"]
jump_address_on_true = 0x8229CC10
#   "lwz r30,-8(r11)" (r11 = object + r22): the character
[[entrypoint.midasm_hook]]
address = 0x8229CC18
name = "MorePlayersLoopChar24"
registers = ["r22", "r30"]
#   "addi r11,r20,4 ; add r4,r28,r11": list A of players 3-4 = ours
