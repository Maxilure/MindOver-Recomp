[[entrypoint.midasm_hook]]
address = 0x822364BC
name = "MorePlayersPointer128Load"
registers = ["r11"]
#   lwz rD,-20184(r11) in a co-op script helper
[[entrypoint.midasm_hook]]
address = 0x82236594
