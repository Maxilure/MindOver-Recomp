0x8248BE10 = {}  # 1 data ref (e.g. 0x8201CE4C); was inside sub_8248BE08
0x8248BE18 = {}  # 1 data ref (e.g. 0x8201CE90); was inside sub_8248BE08
0x8248BE38 = {}  # 1 data ref (e.g. 0x8201CE78); was inside sub_8248BE30
0x8248BE50 = {}  # 1 data ref (e.g. 0x8201CE80); was inside sub_8248BE48

# Small wrappers / thunks whose address is taken (29): passed as
