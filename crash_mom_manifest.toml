# the pointer that was at 0x8259B128: its one store
#   sub_82235DC8: addi r31 = &ptr (0x82235E24), stw r30,-20184(r11) right here; r11 is reloaded by mr r11,r3 at 0x82235E30
[[entrypoint.midasm_hook]]
