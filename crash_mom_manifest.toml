# TITANS CARRIED INTO THE NEXT LEVEL BY PLAYERS 3-4 (findings/26 s.22). sub_8229CB78 runs
# before a level change: for each player (r19 = p, r22 = 24 + 4p, r28 = 1028p) it saves the
# character's state into list A (0x825A6280 + 1028p), and the titan the player rides
# (object +24 list) as its NAME (sub_822705D0, already 4-player) + its state in list B
# (0x825A6A88 + 1028p). The next level's spawn (sub_8229C6F8, hooked above for 4 players)
# reads them back and puts the player in that titan. This WRITER stopped at player 2
# ("cmpwi r19,2 ; bge" + "cmpwi r22,32 ; blt"), so players 3-4's entries stayed empty and
# they arrived on foot, their titan gone (found 2026-10-05 from a playtest report; the gap
# was on the "still 2-player" list since the 25th session). Same treatment as the loops
# above; checked with xexdis: no hook instruction is a branch target. r20 / r26 (list
# bases) stay redirected once p >= 2: only players 3-4 follow in the loop.
[[entrypoint.midasm_hook]]
