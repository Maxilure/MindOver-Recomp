# =============================================================================
# release.yml -- builds the release files on GitHub's machines
# =============================================================================
#
# The Windows runner builds the installer and stages the complete offline
# toolchain. The game is built on the player's computer from their own disc.
#
# WINDOWS ONLY since 0.2.0: Linux releases come back later as a terminal
# tool. The Linux launcher still builds from the source (launcher/), it's
# just not packed here; release.toml then lists no linux_ archive, and an
# old 0.1.0 Linux launcher says "No download for this system".
#
# WHEN:
#   - a version tag is pushed (git tag v0.1.0-alpha && git push origin v0.1.0-alpha):
#     The tag must match VERSION.txt. The ZIP and feed are kept as an Actions
#     artifact. A draft release is created only when distribution of the
#     vendor layout is enabled and the ZIP fits the Releases asset limit.
#   - by hand ("Run workflow" on the Actions tab): the same build, files kept
#     as a downloadable artifact of the run, no release (a test).
#
# Launchers find updates through releases/latest/download/release.toml, i.e.
# the newest PUBLISHED release that isn't marked pre-release (drafts and
# pre-releases aren't "latest"), so releases are never marked pre-release.
# =============================================================================
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # creating the release and attaching its files

jobs:
  windows-release:
    # Workflow artifacts are downloadable on public repositories too.
    if: github.event.repository.private || vars.WINDOWS_LAYOUT_REDISTRIBUTION_ALLOWED == 'true'
    runs-on: windows-2025
    steps:
      # Before the checkout: long paths (the SDK's third-party folders are
      # deep) and no CRLF conversion (only SDL3 / ImGui are compiled here,
      # but keep the files exactly as committed).
      - name: Git settings for Windows
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: "Check out (with the SDK submodule: SDL3 and ImGui come from it)"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Visual Studio's x64 environment (clang needs its libraries)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Windows gets the INSTALLER (launcher/installer.cpp): it installs,
      # updates and uninstalls the game; the game starts from its own
      # Start menu entry.
      - name: Build the installer
        shell: cmd
        run: |
          clang --version
          cmake -S launcher -B out/build/launcher-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ || exit /b 1
          cmake --build out/build/launcher-release --target mind_over_recomp || exit /b 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The tag matches VERSION.txt
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION.txt)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match VERSION.txt (${version}): expected v${version}"
            exit 1
          fi

      - name: Prepare the offline Visual Studio layout
        shell: pwsh
        run: ./tools/release/prepare_vs_layout.ps1 -Layout (Join-Path $env:RUNNER_TEMP 'vs-layout')

      - name: Make the offline Windows release
        shell: bash
        run: |
          tools/make_release.sh --system windows --launcher out/build/launcher-release/mind_over_recomp.exe \
            --windows-vs-layout "$(cygpath -u "$RUNNER_TEMP")/vs-layout"

      - name: Keep the offline package
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/release/
          compression-level: 0

      - name: Create the draft release
        # A private layout may be used to build/test the bundle. Publishing a
        # vendor layout requires the maintainer to confirm distribution rights.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION.txt)
          archive="out/release/${version}/MindOverRecomp-${version}-windows-x86_64.zip"
          if [ "$(wc -c < "$archive")" -ge 2147483648 ]; then
            echo "::notice::The offline ZIP exceeds the GitHub Releases asset limit. Download it from the workflow artifacts."
            exit 0
          fi
          # NOT marked "pre-release" even for -alpha versions: GitHub's
          # releases/latest link (the launchers' update feed) skips those.
          gh release create "${GITHUB_REF_NAME}" --draft \
            --title "Mind over Recomp ${version}" \
            --notes-file tools/release/RELEASE_NOTES.md \
            "$archive" \
            "out/release/${version}/release.toml"
