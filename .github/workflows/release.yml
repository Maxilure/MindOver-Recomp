# =============================================================================
# release.yml -- builds the release files on GitHub's machines
# =============================================================================
#
# WHY HERE: the launcher is the one part of a release that comes ready-built,
# and a Linux program only runs on systems with a C library (glibc) at least
# as new as the one it was built on. Building on Ubuntu 24.04 makes it run on
# 24.04 and everything newer, which is also the oldest kind of system that
# can build the game itself (clang 20+). The game is never built here: each
# player builds it on their own computer, from their own disc.
#
# TWO JOBS:
#   windows-launcher  builds ONLY the launcher .exe (Windows runner, Visual
#                     Studio's x64 environment + LLVM's clang, like the test
#                     PC), kept as an artifact of the run
#   release           (Linux) packs the Windows release with that .exe
#                     (make_release.sh --system windows --launcher): packed
#                     on Linux, so the source has no CRLF line ends or
#                     symlinks-as-text from a Windows checkout
#
# WINDOWS ONLY since 0.2.0: Linux releases come back later as a terminal
# tool. The Linux launcher still builds from the source (launcher/), it's
# just not packed here; release.toml then lists no linux_ archive, and an
# old 0.1.0 Linux launcher says "No download for this system".
#
# WHEN:
#   - a version tag is pushed (git tag v0.1.0-alpha && git push origin v0.1.0-alpha):
#     tools/make_release.sh runs and a DRAFT GitHub release is created with
#     the .zip and release.toml (the update feed). Nothing is
#     public until someone presses Publish on GitHub's Releases page. The tag
#     must match the VERSION.txt file.
#   - by hand ("Run workflow" on the Actions tab): the same build, files kept
#     as a downloadable artifact of the run, no release (a test).
#
# Launchers find updates through releases/latest/download/release.toml, i.e.
# the newest PUBLISHED release that isn't marked pre-release (drafts and
# pre-releases aren't "latest"), so releases are never marked pre-release.
# =============================================================================
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # creating the release and attaching its files

jobs:
  windows-launcher:
    runs-on: windows-2025
    steps:
      # Before the checkout: long paths (the SDK's third-party folders are
      # deep) and no CRLF conversion (only SDL3 / ImGui are compiled here,
      # but keep the files exactly as committed).
      - name: Git settings for Windows
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: "Check out (with the SDK submodule: SDL3 and ImGui come from it)"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Visual Studio's x64 environment (clang needs its libraries)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Windows gets the INSTALLER (launcher/installer.cpp): it installs,
      # updates and uninstalls the game; the game starts from its own
      # Start menu entry.
      - name: Build the installer
        shell: cmd
        run: |
          clang --version
          cmake -S launcher -B out/build/launcher-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ || exit /b 1
          cmake --build out/build/launcher-release --target mind_over_recomp || exit /b 1

      - name: Keep the installer for the release job
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher
          path: out/build/launcher-release/mind_over_recomp.exe

  release:
    needs: windows-launcher
    runs-on: ubuntu-24.04
    steps:
      # The submodule: make_release.sh reads the SDK's commit and tag.
      - name: Check out (with the SDK submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: The tag matches VERSION.txt
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(tr -d '[:space:]' < VERSION.txt)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match VERSION.txt (${version}): expected v${version}"
            exit 1
          fi

      # Outside the checkout: an untracked file would make the tree "dirty".
      - name: Fetch the Windows launcher
        uses: actions/download-artifact@v4
        with:
          name: windows-launcher
          path: ${{ runner.temp }}/windows-launcher

      - name: Make the Windows release (same source, that installer)
        run: tools/make_release.sh --system windows --launcher "${{ runner.temp }}/windows-launcher/mind_over_recomp.exe"

      - name: Keep the files (test runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/release/

      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION.txt)
          # Since 0.2.2-alpha.5 releases come READY-BUILT: packed by hand (the
          # game is built on a PC with the disc; this workflow can't) and
          # published with `gh release create`, which also makes the tag.
          # Then there's nothing to draft: never a second release.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "A release for ${GITHUB_REF_NAME} exists (the ready-built one): no draft."
            exit 0
          fi
          # NOT marked "pre-release" even for -alpha versions: GitHub's
          # releases/latest link (the launchers' update feed) skips those.
          gh release create "${GITHUB_REF_NAME}" --draft \
            --title "Mind over Recomp ${version}" \
            --notes-file tools/release/RELEASE_NOTES.md \
            "out/release/${version}/MindOverRecomp-${version}-windows-x86_64.zip" \
            "out/release/${version}/release.toml"
