# =============================================================================
# MangoHud.conf -- the performance overlay's settings for this port
# =============================================================================
#
# MangoHud draws the fps / GPU / CPU box over the game window. tools/play.sh
# points MangoHud at this file (MANGOHUD_CONFIGFILE) and at presets.conf next
# to it (MANGOHUD_PRESETSFILE), and `tools/play.sh --mangohud` switches the
# overlay on (`mangohud tools/play.sh` works too). Your own
# ~/.config/MangoHud/MangoHud.conf is left alone and not used then.
#
# KEYS (Right Shift + ...; all chosen away from the game's own keys: F3, F4,
# F7 belong to the SDK, F8-F12 to us, and our keys ignore Shift, so the usual
# MangoHud keys Shift+F12 / Shift+F10 would also fire F12 / F10 in the game):
#   Right Shift + F1   hide / show the overlay
#   Right Shift + F2   next layout: detailed -> everything -> compact -> hidden
#   Right Shift + F5   start / stop recording a log (CSV, into logs/mangohud/)
#
# WHAT MANGOHUD'S FPS MEANS: how often the WINDOW shows a new picture. The
# game's own count (--debug_log_fps, in every play.sh log and printed at the
# end) is how many frames the game made. They should agree; if MangoHud says
# less, frames are made but not all reach the screen, which is worth a bug
# report. The layouts themselves are in presets.conf.
# =============================================================================

# Start on layout 2 (detailed); Right Shift + F2 walks through the list.
# 0 = MangoHud's own "no overlay".
preset=2,3,1,0

toggle_hud=Shift_R+F1
toggle_preset=Shift_R+F2
toggle_logging=Shift_R+F5
# Logs go into the project's logs/ folder (gitignored). play.sh uses a copy
# of this file with the full path here (MangoHud needs it absolute).
output_folder=logs/mangohud
