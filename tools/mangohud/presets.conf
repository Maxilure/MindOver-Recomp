# =============================================================================
# presets.conf -- MangoHud layouts for this port (see MangoHud.conf)
# =============================================================================
#
# Right Shift + F2 cycles: 2 detailed -> 3 everything -> 1 compact -> hidden.
# Each [preset N] is a full list of what that layout shows. Option names are
# MangoHud's (its README lists them all); an unknown one is just ignored.
# The shared look (position, size, colours) is repeated in each preset so a
# layout never depends on another one.
# =============================================================================

# 1: COMPACT -- a single row: fps, frame time and the lows.
[preset 1]
horizontal
hud_compact
position=top-left
font_size=20
background_alpha=0.4
fps
frametime
fps_metrics=avg,0.01,0.001
gpu_stats
cpu_stats
text_outline

# 2: DETAILED (the one it starts on) -- what matters for this port's
# performance: the frame rate with its lows and a frame-time graph (spikes =
# stutter), how busy and how hot the graphics card is and at what clock (a
# card at a LOW clock and low load has little to do: the native renderer
# alone), video memory, the processor per core (the game's main thread is
# one busy core), memory, and which Vulkan driver / mode.
[preset 2]
position=top-left
font_size=20
background_alpha=0.5
table_columns=3
text_outline
gpu_name
gpu_stats
gpu_load_change
gpu_load_value=60,90
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_fan
vram
throttling_status
cpu_stats
cpu_load_change
cpu_load_value=60,90
cpu_temp
cpu_mhz
core_load
core_bars
ram
procmem
fps
fps_color_change
fps_value=30,55
fps_metrics=avg,0.01,0.001
frame_count
frametime
frame_timing
resolution
vulkan_driver
refresh_rate

# 3: EVERYTHING -- detailed plus power, swap, disk activity, clock time and
# display details. Busy; for screenshots of a whole situation.
[preset 3]
position=top-left
font_size=18
background_alpha=0.55
table_columns=3
text_outline
gpu_name
gpu_stats
gpu_load_change
gpu_load_value=60,90
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_fan
vram
proc_vram
throttling_status
cpu_stats
cpu_load_change
cpu_load_value=60,90
cpu_temp
cpu_power
cpu_mhz
core_load
core_bars
ram
swap
procmem
io_read
io_write
fps
fps_color_change
fps_value=30,55
fps_metrics=avg,0.01,0.001
frame_count
frametime
frame_timing
show_fps_limit
resolution
vulkan_driver
engine_version
refresh_rate
display_server
arch
time
